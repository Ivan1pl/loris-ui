plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Renders LorisUI screens with Dear ImGui on OpenGL.'
ext.pomName = 'LorisUI Dear ImGui backend'

dependencies {
    api project(':loris-ui-api')
    implementation "org.lwjgl:lwjgl-stb:${rootProject.ext.lwjglVersion}"
    compileOnly "io.github.spair:imgui-java-app:${rootProject.ext.imguiVersion}"

    runtimeOnly('io.github.spair:imgui-java-app') {
        version {
            require "[${rootProject.ext.imguiVersion},1.93)"
            prefer rootProject.ext.imguiVersion
        }
    }
    runtimeOnly "org.lwjgl:lwjgl-stb:${rootProject.ext.lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb:${rootProject.ext.lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-stb:${rootProject.ext.lwjglVersion}:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-stb:${rootProject.ext.lwjglVersion}:natives-macos-arm64"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('javadoc', Javadoc) {
    exclude '**/impl/**'
    options.addPathOption('sourcepath').value = sourceSets.main.java.srcDirs.toList()
}

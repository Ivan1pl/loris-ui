plugins {
    id 'java-library'
    id 'maven-publish'
}

description = 'Toolkit-agnostic LorisUI API: a declarative component model for game menus and HUDs, screens, ' +
        'and the backend port that renders them.'
ext.pomName = 'LorisUI API'

configurations {
    mockitoAgent
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.mockito:mockito-core:${rootProject.ext.mockitoVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent("org.mockito:mockito-core:${rootProject.ext.mockitoVersion}") {
        transitive = false
    }
}

tasks.withType(Test).configureEach {
    FileCollection agent = configurations.mockitoAgent
    jvmArgumentProviders.add({ ["-javaagent:${agent.singleFile.absolutePath}"] } as CommandLineArgumentProvider)
}

plugins {
    id 'java-library'
    id 'maven-publish'
}

description = "Hosts LorisUI screens in an application's own LWJGL SDL3 window and OpenGL loop."
ext.pomName = 'LorisUI LWJGL/SDL3 host'

dependencies {
    api project(':loris-ui-imgui')
    compileOnly "org.lwjgl:lwjgl:${rootProject.ext.lwjglVersion}"
    compileOnly "org.lwjgl:lwjgl-sdl:${rootProject.ext.lwjglVersion}"
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

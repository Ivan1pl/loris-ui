plugins {
    id 'java'
}

dependencies {
    implementation project(':loris-ui-jme3')
    implementation project(':loris-ui-lwjgl')
    implementation "org.jmonkeyengine:jme3-core:${rootProject.ext.jmonkeyVersion}"
    implementation "org.jmonkeyengine:jme3-desktop:${rootProject.ext.jmonkeyVersion}"
    implementation "org.jmonkeyengine:jme3-lwjgl3:${rootProject.ext.jmonkeyVersion}"
    implementation "org.lwjgl:lwjgl:${rootProject.ext.lwjglVersion}"
    implementation "org.lwjgl:lwjgl-sdl:${rootProject.ext.lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${rootProject.ext.lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${rootProject.ext.lwjglVersion}"
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runJme3Example', JavaExec) {
    group = 'application'
    description = 'Runs the LorisUI example in a jMonkeyEngine 3 application.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ivan1pl.lorisui.example.jme3.LorisJme3Example'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('runLwjglSdlGl3Example', JavaExec) {
    group = 'application'
    description = 'Runs the LorisUI example in a plain LWJGL SDL3 window with OpenGL 3.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ivan1pl.lorisui.example.lwjgl.LorisLwjglSdlGl3Example'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('runLwjglGlfwGl3Example', JavaExec) {
    group = 'application'
    description = 'Runs the LorisUI example in a plain LWJGL GLFW window with OpenGL 3.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ivan1pl.lorisui.example.lwjgl.LorisLwjglGlfwGl3Example'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('runLwjglSdlGpuExample', JavaExec) {
    group = 'application'
    description = 'Runs the LorisUI example in a plain LWJGL SDL3 window with SDL_GPU.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ivan1pl.lorisui.example.lwjgl.LorisLwjglSdlGpuExample'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'lorisui.example.gpuDebug', providers.systemProperty('lorisui.example.gpuDebug').getOrElse('false')
}

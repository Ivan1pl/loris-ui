plugins {
    id 'java-library'
    id 'maven-publish'
}

configurations {
    mockitoAgent
}

dependencies {
    api project(':loris-ui-api')
    api 'io.github.spair:imgui-java-app:1.92.7.1'
    api "org.lwjgl:lwjgl-stb:${rootProject.ext.lwjglVersion}"

    runtimeOnly "org.lwjgl:lwjgl-stb:${rootProject.ext.lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb:${rootProject.ext.lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-stb:${rootProject.ext.lwjglVersion}:natives-macos"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.mockito:mockito-core:${rootProject.ext.mockitoVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent("org.mockito:mockito-core:${rootProject.ext.mockitoVersion}") {
        transitive = false
    }
}

tasks.withType(Test).configureEach {
    FileCollection agent = configurations.mockitoAgent
    jvmArgumentProviders.add({ ["-javaagent:${agent.singleFile.absolutePath}"] } as CommandLineArgumentProvider)
}

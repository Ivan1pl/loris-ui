ext {
    jmonkeyVersion = '3.10.0-SNAPSHOT'
    lwjglVersion = '3.4.1'
    mockitoVersion = '5.24.0'
    imguiVersion = '1.92.7.1'
    checkstyleVersion = '14.3.0'
}

allprojects {
    group = 'com.ivan1pl.loris-ui'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }

        apply plugin: 'checkstyle'
        checkstyle {
            toolVersion = rootProject.ext.checkstyleVersion
            configDirectory = rootProject.layout.projectDirectory.dir('config/checkstyle')
            maxWarnings = 0
        }
    }

    plugins.withId('maven-publish') {
        java {
            withSourcesJar()
            withJavadocJar()
        }

        publishing {
            publications {
                maven(MavenPublication) {
                    from components.java
                    pom {
                        name = project.provider {
                            if (!project.ext.has('pomName')) {
                                throw new GradleException("Project ${project.path} must set ext.pomName in its " +
                                        'build.gradle; the published POM requires it')
                            }
                            project.ext.pomName
                        }
                        description = project.provider {
                            if (!project.description) {
                                throw new GradleException("Project ${project.path} must set description in its " +
                                        'build.gradle; the published POM requires it')
                            }
                            project.description
                        }
                        url = 'https://github.com/Ivan1pl/loris-ui'
                        licenses {
                            license {
                                name = 'Apache License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0'
                            }
                        }
                        developers {
                            developer {
                                id = 'Ivan1pl'
                                name = 'Mikołaj Nowak'
                                email = 'ivan.legnica@gmail.com'
                            }
                        }
                        scm {
                            connection = 'scm:git:https://github.com/Ivan1pl/loris-ui.git'
                            url = 'https://github.com/Ivan1pl/loris-ui'
                        }
                    }
                }
            }
        }

        tasks.named('javadoc', Javadoc) {
            options.addBooleanOption('Xdoclint:all', true)
            options.addBooleanOption('Werror', true)
        }

        tasks.named('check') {
            dependsOn 'javadoc'
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            '--patch-module', 'jme3.core=' + configurations.compileClasspath.find { it.name.contains('jme3-lwjgl3') }?.absolutePath
    ]
}

dependencies {
    api project(':loris-ui-imgui')
    implementation("org.jmonkeyengine:jme3-core:$jmonkeyVersion") {
        transitive = false
    }
    implementation("org.jmonkeyengine:jme3-lwjgl3:$jmonkeyVersion") {
        transitive = false
    }
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
